name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=.." >> "$GITHUB_ENV"
          elif [ -f VpnForge/settings.gradle.kts ]; then
            echo "PROJECT_DIR=VpnForge" >> "$GITHUB_ENV"
          else
            echo "::error::Project (settings.gradle.kts) not found!"
            exit 1
          fi
          echo "Project dir: $PROJECT_DIR"

      - name: Ensure Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          if [ ! -x ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --no-daemon

      - name: Show APK output
        run: |
          cd "$PROJECT_DIR"
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk"
